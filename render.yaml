services:
  - type: web
    name: fib-time-price
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CACHE_TTL
        value: "600"
      # Financial Modeling Prep API key (primary data source). Paste the value
      # in Render > fib-time-price > Environment; never commit it.
      - key: FMP_API_KEY
        sync: false
      # Contact string for SEC EDGAR requests (fair-access policy), e.g. "Your Name you@example.com".
      # Enables the IPO offer-price cross-check / fallback against the SEC 424B4 filing.
      - key: SEC_USER_AGENT
        sync: false
